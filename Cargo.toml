[package]
name = "hive"
version = "0.1.0"
edition = "2024"

[lib]
name = "hive"
path = "src/lib.rs"

[[bin]]
name = "hive"
path = "src/main.rs"

[dependencies]
actix = "0.13"
anyhow = "1.0.102"
crossterm = "0.29.0"
ratatui = "0.30.1"
tokio = { version = "1", features = ["full"] }
log = "0.4"
rig-core = "0.38"
serde_json = "1.0"
env_logger = "0.11.10"
futures = "0.3.32"
textwrap = "0.16.2"
rand = "0.10.1"
